<section id="tool" class="tool">
  <h2>客户报告生成</h2>
  <p class="note">选择日志（.log / .txt）和工单或告警（.csv）。文件只在你的浏览器里处理，不会上传到任何服务器。</p>
  <div class="form">
    <label>客户名 <input id="f-client" value="客户名称"></label>
    <label>编制人 <input id="f-author" value="陈振旭"></label>
    <label>报告标题 <input id="f-title" value="运维问题分析报告"></label>
    <label>告警：全量总桌面 <input id="f-total" type="number" placeholder="可选"></label>
    <label>告警：全量在线 <input id="f-online" type="number" placeholder="可选"></label>
    <label>告警：涉及 VPC <input id="f-vpc" type="number" placeholder="可选"></label>
  </div>
  <input id="f-files" type="file" multiple accept=".log,.txt,.csv">
  <div class="actions">
    <button id="f-demo-log" type="button" class="ghost">演示：日志报告</button>
    <button id="f-demo-alert" type="button" class="ghost">演示：告警报告</button>
  </div>
  <div class="actions">
    <button id="f-run" type="button">生成报告（用所选文件）</button>
    <button id="f-print" type="button" hidden>打印 / 另存为 PDF</button>
  </div>
  <div id="f-status" class="note"></div>
  <div id="reportOut"></div>
</section>
