<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI 运维咨询</title>
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --bg: #f1f5f9;
    --teal: #0d9488;
    --indigo: #4f46e5;
    --amber: #d97706;
    --rose: #e11d48;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #f0fdfa 0%, #eef2ff 50%, #fff7ed 100%) fixed;
    line-height: 1.65;
    min-height: 100vh;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }

  /* 密码页 */
  #gate { display: flex; gap: 8px; margin-top: 15vh; }
  #gate input { flex: 1; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  #gate button { padding: 12px 20px; font-size: 16px; border: 0; border-radius: 10px; background: linear-gradient(135deg, var(--teal), var(--indigo)); color: #fff; cursor: pointer; }
  #err { color: var(--rose); min-height: 1.5em; margin-top: 8px; }

  /* 内容区 */
  .hero { padding: 28px 28px 24px; border-radius: 18px; background: linear-gradient(135deg, var(--teal), var(--indigo)); color: #fff; margin-bottom: 8px; }
  .hero h1 { margin: 0 0 6px; font-size: 30px; }
  .hero .lead { margin: 0; opacity: .92; }
  h2 { font-size: 20px; margin: 36px 0 14px; padding-left: 12px; border-left: 4px solid var(--teal); }
  h3 { font-size: 16px; margin: 0 0 6px; }
  p { margin: 6px 0; }
  .note { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.04); border-top: 3px solid var(--indigo); }
  .grid .card:nth-child(4n+1) { border-top-color: var(--teal); }
  .grid .card:nth-child(4n+2) { border-top-color: var(--indigo); }
  .grid .card:nth-child(4n+3) { border-top-color: var(--amber); }
  .grid .card:nth-child(4n+4) { border-top-color: var(--rose); }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #ccfbf1; color: #0f766e; margin-right: 6px; }
  ol, ul { padding-left: 22px; }
  li { margin: 6px 0; }
  ol li::marker { color: var(--indigo); font-weight: 700; }
  code { background: #e2e8f0; padding: 1px 6px; border-radius: 4px; font-size: 90%; }
  pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 12px; overflow-x: auto; }
  .contact { margin-top: 40px; padding: 18px; border-radius: 14px; background: #fff; border: 1px dashed var(--teal); }
  .contact p { margin: 4px 0; }
  #content[hidden] { display: none; }

  /* 报告工具 */
  .tool { margin-top: 48px; padding: 22px; border-radius: 18px; background: #fff; box-shadow: 0 4px 16px rgba(15,23,42,.06); }
  .tool .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 12px 0; }
  .tool label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .tool input[type=text], .tool input:not([type]), .tool input[type=number] { padding: 8px 10px; font-size: 14px; }
  .tool input[type=file] { margin: 8px 0; }
  .tool .actions { display: flex; gap: 8px; margin: 8px 0; }
  .tool button { padding: 9px 16px; font-size: 14px; }
  .report-wrap { margin-top: 20px; padding: 24px; border-radius: 14px; background: #fff; border: 1px solid var(--line); position: relative; overflow: hidden; }
  .report-wrap h1 { font-size: 22px; margin: 0 0 4px; color: var(--teal); }
  .report-wrap h2 { font-size: 15px; margin: 18px 0 6px; }
  .report-wrap table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 13px; }
  .report-wrap th, .report-wrap td { border-bottom: 1px solid var(--line); padding: 5px 7px; text-align: left; vertical-align: top; }
  .report-wrap th { background: #f1f5f9; }
  .report-wrap code { font-size: 12px; background: #f1f5f9; padding: 0 3px; word-break: break-all; }
  .report-wrap .kpi td { text-align: center; font-size: 18px; font-weight: bold; color: var(--teal); }
  .report-wrap .kpi th { font-size: 12px; color: var(--muted); font-weight: normal; }
  .report-wrap .meta { color: var(--muted); font-size: 12px; }
  .report-wrap .watermark { position: absolute; top: 38%; left: -8%; width: 120%; text-align: center; font-size: 46px; font-weight: bold; color: rgba(79,70,229,0.07); transform: rotate(-30deg); white-space: nowrap; pointer-events: none; }
  .report-wrap .report { position: relative; }

  @page { size: A4; margin: 16mm 14mm; }
  body.printing #content > *:not(#tool) { display: none !important; }
  body.printing #tool > *:not(#reportOut) { display: none !important; }
  body.printing .tool { box-shadow: none; padding: 0; }
  body.printing .report-wrap { border: none; padding: 0; }
  body.printing main { max-width: none; padding: 0; }
  body.printing body, body.printing { background: #fff; }
</style>
</head>
<body>
<main>
<div id="gate">
  <input id="pw" type="password" placeholder="请输入访问密码" autocomplete="off">
  <button id="go">进入</button>
</div>
<div id="err"></div>
<div id="content" hidden></div>
</main>
<script>
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  try {
    const { salt, iv, data } = await (await fetch("content.enc.json")).json();
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(salt), iterations: 600000, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(iv) }, key, b64(data));
    const payload = JSON.parse(new TextDecoder().decode(plain));
    document.getElementById("content").innerHTML = payload.html;
    new Function(payload.js)();
    document.getElementById("gate").remove();
    err.textContent = "";
    document.getElementById("content").hidden = false;
  } catch (e) {
    err.textContent = "密码错误";
  }
}
document.getElementById("go").onclick = unlock;
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
</script>
</body>
</html>
